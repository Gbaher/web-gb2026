[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/case-sofia"
  to = "/case-sofia.html"
  status = 200

[[redirects]]
  from = "/case-alalay"
  to = "/case-alalay.html"
  status = 200

[[redirects]]
  from = "/case-bodega"
  to = "/case-bodega.html"
  status = 200

[[redirects]]
  from = "/brand-intelligence"
  to = "/brand-intelligence.html"
  status = 200

[[redirects]]
  from = "/bi-001-logo-vs-marca"
  to = "/bi-001-logo-vs-marca.html"
  status = 200

# Redirige la URL con .html a la URL canónica sin .html (evita contenido duplicado)
[[redirects]]
  from = "/case-sofia.html"
  to = "/case-sofia"
  status = 301
  force = true

[[redirects]]
  from = "/case-alalay.html"
  to = "/case-alalay"
  status = 301
  force = true

[[redirects]]
  from = "/case-bodega.html"
  to = "/case-bodega"
  status = 301
  force = true
