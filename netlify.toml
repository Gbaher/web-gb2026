[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/case-sofia"
  to = "/case-sofia.html"
  status = 200

[[redirects]]
  from = "/case-alalay"
  to = "/case-alalay.html"
  status = 200

[[redirects]]
  from = "/case-bodega"
  to = "/case-bodega.html"
  status = 200
